spring.application.name=scooter-rental

spring.datasource.url=jdbc:h2:file:./data/scooter-rental;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true

app.security.jwt.secret=change-this-secret-key-for-production-1234567890
app.security.jwt.expiration-seconds=3600

